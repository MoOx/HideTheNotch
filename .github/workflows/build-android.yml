name: APK Android

# Construit l'APK entièrement sur GitHub : ni compte Expo, ni crédits EAS, ni
# compte Google. Le repo étant public, les runners standard sont gratuits.
on:
  workflow_dispatch:
  # `workflow_dispatch` n'est déclenchable que depuis la branche par défaut.
  # En attendant la fusion, un marqueur dans le message de commit suffit.
  push:

defaults:
  run:
    working-directory: v2

jobs:
  apk:
    name: assembleRelease
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-apk]')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Générer le projet natif
        run: npx expo prebuild --platform android --no-install

      # Le gabarit Expo signe le build release avec le keystore de debug : rien
      # à fournir pour un APK installable en test.
      # RN 0.86 en nouvelle architecture compile du C++ pour les quatre ABI, ce
      # qui dépasse 45 minutes sur un runner deux cœurs. Un APK de test n'a
      # besoin que d'arm64 : c'est ce que fait tout téléphone réel depuis des
      # années, et le build passe sous les dix minutes.
      - name: Compiler
        working-directory: v2/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Nom de l'artefact
        id: name
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: hidethenotch-${{ steps.name.outputs.sha }}-apk
          path: v2/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
