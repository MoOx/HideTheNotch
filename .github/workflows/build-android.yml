name: APK Android

# Construit l'APK entièrement sur GitHub : ni compte Expo, ni crédits EAS, ni
# compte Google. Le repo étant public, les runners standard sont gratuits.
on:
  workflow_dispatch:
  # `workflow_dispatch` n'est déclenchable que depuis la branche par défaut.
  # En attendant la fusion, un marqueur dans le message de commit suffit.
  push:

jobs:
  apk:
    name: assembleRelease
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-apk]')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Générer le projet natif
        run: npx expo prebuild --platform android --no-install

      # Le gabarit Expo signe le build release avec le keystore de debug : rien
      # à fournir pour un APK installable en test.
      # Deux choses ici.
      #
      # `-PreactNativeArchitectures=arm64-v8a` : un APK de test n'a pas besoin
      # des tranches x86, qui ne servent qu'aux émulateurs. Pour tester sur un
      # émulateur, rajouter x86_64.
      #
      # `-x lintVitalRelease` : AGP lance lintVital sur les builds release, y
      # compris dans les modules des dépendances, et il échoue sur
      # react-native-skia et expo-modules-core pour des raisons étrangères à
      # cette app. Le désactiver par le DSL ne marche pas — AGP lit
      # `checkReleaseBuilds` avant qu'un plugin de config puisse l'écrire —
      # donc on exclut la tâche, ce qui retire aussi ses dépendances exclusives.
      - name: Compiler
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a -x lintVitalRelease

      - name: Nom de l'artefact
        id: name
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: hidethenotch-${{ steps.name.outputs.sha }}-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
