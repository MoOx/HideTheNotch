name: iOS TestFlight

# Build signé avec votre compte Apple, envoyé sur TestFlight. Tourne sur les
# runners macOS de GitHub — gratuits ici, le dépôt étant public — donc sans
# consommer de crédits EAS ni de Mac.
#
# Secrets à créer (Settings ▸ Secrets and variables ▸ Actions) :
#
#   ASC_KEY_ID          identifiant de la clé d'API App Store Connect
#   ASC_ISSUER_ID       identifiant de l'émetteur, sur la même page
#   ASC_KEY_P8_BASE64   le fichier .p8 encodé : base64 -i AuthKey_XXX.p8 | pbcopy
#   MATCH_GIT_URL       URL HTTPS d'un dépôt GitHub **privé** dédié aux certificats
#   MATCH_PASSWORD      phrase secrète qui chiffre ce dépôt (à inventer)
#   MATCH_GIT_AUTH      base64 de "utilisateur:jeton" — un jeton d'accès personnel
#                       ayant le droit d'écrire sur ce dépôt.
#                       echo -n 'MoOx:ghp_xxx' | base64
#
# Le dépôt de certificats doit être privé et séparé : celui-ci est public.
#
# Première exécution : lancer avec `seed_signing` coché, pour que match crée les
# certificats et les dépose. Ensuite, laisser décoché — le CI ne fait plus que
# les consommer.

on:
  workflow_dispatch:
    inputs:
      seed_signing:
        description: "Créer les certificats (première exécution uniquement)"
        type: boolean
        default: false

defaults:
  run:
    working-directory: v2

jobs:
  testflight:
    name: build signé + TestFlight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: v2

      - run: npm ci

      # Le projet Xcode est régénéré à chaque build par `expo prebuild` :
      # incrémenter le numéro de build dans le projet n'aurait aucun effet
      # durable. On l'écrit donc dans app.json juste avant, à partir du numéro
      # de run, qui est monotone par construction.
      - name: Numéro de build
        run: |
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            c.expo.ios.buildNumber = String(${{ github.run_number }});
            fs.writeFileSync('app.json', JSON.stringify(c, null, 2) + '\n');
            console.log('buildNumber =', c.expo.ios.buildNumber);
          "

      - name: Générer le projet natif
        run: npx expo prebuild --platform ios --no-install

      - name: CocoaPods
        run: npx pod-install

      - name: fastlane beta
        run: bundle exec fastlane ios beta seed:${{ inputs.seed_signing }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_AUTH }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"

      - name: Journal en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fastlane-logs
          path: |
            ~/Library/Logs/gym
            v2/fastlane/report.xml
          if-no-files-found: ignore
