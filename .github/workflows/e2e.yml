name: End to end

# The release build, started on a simulator and driven through what the app is
# for: the Maestro flows in .maestro/, run by tools/e2e.sh.
#
# iOS only. Android is run locally with `npm run e2e:android`, on an emulator
# booted with `-gpu host`: the hosted Linux runners have no GPU, the emulator
# then renders in software (SwiftShader), and one frame of the wallpaper at
# 1080 x 2400 takes about five seconds. The app is declared not responding
# before a flow can finish. No phone renders without a GPU, so that is the
# runner's limit and not the app's, and a job that always fails for it would
# only teach everybody to ignore it.
#
# Everything else in CI proves that the code compiles, bundles and draws the
# right pixels, and none of it starts the app. This is the job that notices a
# launch image that never goes, a tap that does nothing, or a crash on export.
#
# Not on every push: the iOS half is a macOS runner and a full native build.
# Run it before a release, by hand or with `[e2e]` in the commit message
# (`workflow_dispatch` cannot be triggered from a branch that is not the
# default one, hence the marker, like the other workflows here).
on:
  workflow_dispatch:
  push:
    branches: ["**"]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned: a flow that passes today should not fail tomorrow because the tool
  # changed underneath it. Bump by hand, after running the flows locally.
  MAESTRO_VERSION: 2.10.0

jobs:
  ios:
    name: iOS simulator
    runs-on: macos-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[e2e]')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - name: Build
        run: tools/marketing/build-ios-sim.sh

      - name: Maestro
        run: |
          curl -fsSL -o maestro.zip \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          unzip -q maestro.zip -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"

      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[]
                     | select(.name | test("^iPhone .* Pro$"))] | last | .udid')
          echo "Booting $udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      - name: Flows
        run: tools/e2e.sh ios

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-ios
          path: ~/.maestro/tests
          retention-days: 7
