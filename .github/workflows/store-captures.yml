name: Store captures

# Photographs the app's interface on both platforms and composes the two decks.
#
# Nothing here drives the interface: every state in src/demo/shots.ts is a URL,
# the app walks into it, and the runner takes a picture. So this workflow needs
# no UI automation, no test target, and no signing.
#
# The captures are not committed, so this is where they come from for anyone
# without both toolchains, and it is the only place both platforms are shot
# from the same commit. Everything it produces is an artefact: the two sets of
# captures, and the composed decks.
#
# It costs nothing but time. The repository is public, so the hosted runners are
# free, macOS included. It costs about forty minutes of waiting, most of it two
# release builds, and the two halves run at once.
#
# Manual only. `workflow_dispatch` cannot be triggered from a branch that is not
# the default one, hence the commit marker, like the other build workflows.
on:
  workflow_dispatch:
    inputs:
      push_listings:
        description: "Also push the composed deck and the copy to both stores"
        type: boolean
        default: false
  push:
    branches: ["**"]

jobs:
  ios:
    name: iOS simulator
    runs-on: macos-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[captures]') ||
      contains(github.event.head_commit.message, '[store]')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      # Prebuild, pods and xcodebuild: the same script a person runs, so the
      # two cannot drift apart.
      - name: Build
        run: tools/marketing/build-ios-sim.sh

      - name: Capture
        env:
          HTN_DEVICE: iPhone 17 Pro Max
        run: |
          set -eo pipefail
          HTN_APP=$(ls -d build/Build/Products/Release-iphonesimulator/*.app | head -1) \
            tools/marketing/capture-ios.sh

      # The whole tree, because a capture lives under its language:
      # `marketing/captures/ios/<lang>/<id>.png`.
      #
      # Kept a week rather than the default ninety days. These are an
      # intermediate product, seventy megabytes of it per run, and the only
      # thing that needs them is the deck job below, in this same run. A week
      # is there for the case where the deck is wrong and the captures were
      # fine, which is worth not paying for twice.
      # The same build, a second device. `npm run deck` composes three decks
      # now, and the iPad one reads its own captures: without this the deck job
      # stops on `no capture at marketing/captures/ipad/en/05-compare.png`,
      # which is what it did the first time both halves got this far.
      - name: Capture, iPad
        env:
          HTN_DEVICE: iPad Air 13-inch (M4)
          HTN_OUT: marketing/captures/ipad
        run: |
          set -eo pipefail
          HTN_APP=$(ls -d build/Build/Products/Release-iphonesimulator/*.app | head -1) \
            tools/marketing/capture-ios.sh

      - uses: actions/upload-artifact@v4
        with:
          name: captures-ios
          path: marketing/captures/ios
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: captures-ipad
          path: marketing/captures/ipad
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android emulator
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[captures]') ||
      contains(github.event.head_commit.message, '[store]')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Prebuild and Gradle: the same script a person runs.
      - name: Build the APK
        run: tools/marketing/build-android.sh

      # The emulator needs KVM, which is available on the hosted Linux runners
      # once the device node is world writable.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # A Pixel 6 is 1080 x 2400 at 420 dpi, which is what both decks are
          # composed against. It is also, like every AVD, a screen with no hole
          # in it: the capture script turns on the AOSP cutout overlay itself,
          # so the emulator grows a punch hole before the app is ever launched.
          profile: pixel_6
          disable-animations: true
          # One line, no continuation: the action hands each line of this to
          # `sh -c` on its own, so a trailing backslash arrives as a command
          # called "\" and the job dies after twenty minutes of building.
          script: HTN_APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1) tools/marketing/capture-android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: captures-android
          path: marketing/captures/android
          if-no-files-found: error
          retention-days: 7

  deck:
    name: Compose both decks
    runs-on: ubuntu-latest
    needs: [ios, android]
    # The preview below writes a branch and a comment, and the default token is
    # read only on a repository that says so.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: captures-ios
          path: marketing/captures/ios
      - uses: actions/download-artifact@v4
        with:
          name: captures-ipad
          path: marketing/captures/ipad
      - uses: actions/download-artifact@v4
        with:
          name: captures-android
          path: marketing/captures/android

      # Chromium is what draws the deck, and the runner already has one.
      - name: Compose
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run deck

      # This one is the point of the whole workflow, and it is what a person
      # downloads: `npm run deck:fetch`. Ninety days, the default, because a
      # listing is uploaded from it days or weeks after it was composed.
      - uses: actions/upload-artifact@v4
        with:
          name: store-deck
          path: marketing/renders/**/*.png
          if-no-files-found: error

      # --- the preview -----------------------------------------------------
      #
      # A deck cannot be looked at from here: it is ninety images and a hundred
      # and ninety megabytes, and the artefact above is a zip behind a token, so
      # GitHub will not render anything out of it. One contact sheet per deck
      # can be looked at, and it carries every locale, which is the only way a
      # capture that failed in Japanese and nowhere else is ever noticed.
      - name: ImageMagick
        run: command -v magick >/dev/null 2>&1 || sudo apt-get install -y --no-install-recommends imagemagick

      - name: Contact sheets
        run: tools/marketing/contact-sheet.sh build/sheets

      # An orphan branch, force pushed, so this never touches the history of a
      # real one. One commit with no parent: the previous set stops being
      # reachable rather than piling up behind it. Two megabytes a run, against
      # the hundred and ninety the deck itself would have cost, which is why the
      # captures are not committed in the first place.
      - name: Publish the sheets
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          work=$(mktemp -d)
          cp build/sheets/*.jpg "$work/"
          cat > "$work/README.md" <<'EOF'
          Contact sheets for the last store capture run, one row per locale.

          Written by .github/workflows/store-captures.yml, force pushed on every
          run, and referenced from a commit or pull request comment. Nothing
          reads this branch, nothing merges it, and the sheets it held before
          are gone. The decks themselves are run artefacts.
          EOF
          cd "$work"
          git init -q -b deck-preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deck preview for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deck-preview
          # Pinned to this commit rather than to the branch, so an old comment
          # goes to a dead link instead of quietly showing a later run's deck.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Comment with the preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          set -eo pipefail
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${PREVIEW_SHA}"
          run="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          body=$(mktemp)
          {
            echo "### Deck preview \`${GITHUB_SHA:0:7}\`"
            echo
            echo "One row per locale, one column per shot. Click a sheet for it full size."
            echo "The decks themselves are in the [\`store-deck\` artefact](${run})."
            echo
            for sheet in build/sheets/preview-*.jpg; do
              name=$(basename "$sheet" .jpg); name=${name#preview-}
              echo "**${name}**"
              echo
              echo "[![${name}](${raw}/$(basename "$sheet"))](${raw}/$(basename "$sheet"))"
              echo
            done
            echo "<sub>Sheets are JPEG and downscaled, for spotting a capture that went wrong."
            echo "Judge the black against the deck itself. Replaced by the next run.</sub>"
          } > "$body"

          # A pull request gets one comment kept up to date, because a branch
          # under review is pushed to more than once and a stack of these would
          # bury the conversation. A branch without one gets a commit comment,
          # which is the only place there is to put it.
          pr=$(gh pr list --head "${GITHUB_REF_NAME}" --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$pr" ] && [ "$pr" != "null" ]; then
            mine=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments"               --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("### Deck preview")))] | last | .id' 2>/dev/null || true)
            if [ -n "$mine" ] && [ "$mine" != "null" ]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${mine}" -F body=@"$body" >/dev/null
              echo "Updated the preview comment on #${pr}."
            else
              gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" -F body=@"$body" >/dev/null
              echo "Commented on #${pr}."
            fi
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@"$body" >/dev/null
            echo "Commented on ${GITHUB_SHA:0:7}."
          fi

  metadata:
    name: Push both listings
    runs-on: ubuntu-latest
    needs: [deck]
    # Never on a plain `[captures]` run. Photographing the app is something you
    # do to look at the result; writing it to two stores is something you do on
    # purpose, so it takes its own word.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.push_listings) ||
      contains(github.event.head_commit.message, '[store]')
    env:
      APP_IDENTIFIER: io.moox.HideTheNotch
      ANDROID_PACKAGE_NAME: io.moox.hidethenotch
      CERTS_REPO_URL: git@github.com:MoOx/certificates.git
      SECRETS_PASSPHRASE: ${{ secrets.SECRETS_PASSPHRASE }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Check the deploy key is present
        run: |
          if [ -z "${{ secrets.CERTIFICATES_DEPLOY_KEY }}" ]; then
            echo "CERTIFICATES_DEPLOY_KEY is not set on this repository."
            exit 1
          fi

      - name: Access the certificates repository
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.CERTIFICATES_DEPLOY_KEY }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # The deck the job above just composed. `store:listing` refuses to write a
      # listing with no deck at all, on purpose, so this is not optional.
      - uses: actions/download-artifact@v4
        with:
          name: store-deck
          path: marketing/renders

      - name: What the deck holds
        run: find marketing/renders -name '*.png' | sort

      # Play first, because it is the one that always works: a listing there
      # belongs to the app rather than to a release, so it goes up whether or
      # not anything has ever shipped. Both lanes regenerate the metadata trees
      # from marketing/listing.json before uploading, and neither builds a thing.
      - name: Play listing
        run: bundle exec fastlane android metadata

      # Last, because it is the one that can legitimately fail. `deliver` writes
      # onto whichever version is open for editing in App Store Connect, and on
      # an app with none it retries for five minutes and gives up with "Cannot
      # find edit app store version". That is not this workflow being broken, it
      # is App Store Connect having no version to write to: create it with
      # `promote:ios` or by hand, then this passes.
      - name: App Store listing
        run: bundle exec fastlane ios metadata
