name: Verify

on:
  push:
    paths:
      - "src/**"
      - "App.tsx"
      - "tools/**"
      - "assets/**"
      - "app.json"
      - "package.json"
      - ".github/workflows/verify.yml"
  pull_request:
    paths:
      - "src/**"
      - "App.tsx"
      - "tools/**"
      - "assets/**"
      - "app.json"
      - "package.json"
      - ".github/workflows/verify.yml"
  workflow_dispatch:

jobs:
  verify:
    name: Types, rendering, artwork, bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # The pre commit hook formats what is committed, so this only ever fails
      # for someone who bypassed it. Which is the point of having it here.
      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Runs the real rendering code against CanvasKit and checks the pixels:
      # absolute black under the cutout, fade actually dithered.
      - name: Verify the rendering
        run: npm run verify

      # The icon has one source, tools/brand.cjs, and the rasters every platform
      # reads are committed next to it. This redraws all of them and compares,
      # which is what stops the two from drifting: they had, and the Android
      # icon was a year behind the others. Chromium draws them, and the runner
      # already has one.
      - name: Verify the brand artwork
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run brand:check

      - name: Bundle iOS
        run: npx expo export --platform ios --output-dir /tmp/export-ios

      - name: Bundle Android
        run: npx expo export --platform android --output-dir /tmp/export-android

      # Images to look at straight from the Actions tab, with nothing to
      # install: the shortest visual feedback loop on a branch.
      - name: Sample renders
        run: npm run samples

      - uses: actions/upload-artifact@v4
        with:
          name: renders
          path: renders/*.png
          if-no-files-found: error
